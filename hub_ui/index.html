<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Hub - Kitchen Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Family Hub Dashboard</h1>
        </header>
        
        <main>
            <section class="dashboard">
                <h2>Today's Overview</h2>
                <div id="calendar-widget">Calendar widget would be here</div>
                <div id="weather-widget">Weather widget would be here</div>
                <div id="news-ticker">News ticker would be here</div>
            </section>
            
            <section class="media-controls">
                <h2>Media Controls</h2>
                <button class="media-btn" onclick="openMedia('https://www.youtube.com/')">YouTube</button>
                <button class="media-btn" onclick="openMedia('https://www.twitch.tv/')">Twitch</button>
                <button class="media-btn" onclick="openMedia('https://pluto.tv/')">Pluto TV</button>
                <button class="media-btn" onclick="openMedia('https://www.roku.com/')">Roku Channel</button>
                <button class="media-btn" onclick="openMedia('https://vimeo.com/')">Vimeo</button>
                <button class="media-btn" onclick="openMedia('https://www.dailymotion.com/')">Dailymotion</button>
            </section>
            
            <section class="taskbar">
                <h2>Taskbar</h2>
                <button onclick="closeMedia()">Close Media (Ctrl+Shift+X)</button>
            </section>
            
            <!-- Dev-only fallback iframe (commented out for production, uncomment for development) -->
            <!-- <iframe id="dev-frame" style="display:none; width:100%; height:400px; border:1px solid #ccc;"></iframe> -->
        </main>
    </div>

    <script>
        window.MEDIA_LAUNCHER_TOKEN = "__MEDIA_LAUNCHER_TOKEN__";
    </script>
    <script src="js/media-client.js"></script>
</body>
</html>
