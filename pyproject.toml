[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen_hub"
version = "0.1.0"
description = "A self-contained Kitchen Hub dashboard application"
readme = "README.md"
authors = [{name = "Kitchen Hub Team"}]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "Flask==3.1.2",
    "PyJWT==2.9.0",
    "PyYAML==6.0.3",
    "APScheduler==3.11.2",
    "requests==2.32.4",
    "feedparser==6.0.12",
    "pydantic==2.11.7",
    "icalendar==6.3.2",
    "Flask-SocketIO==5.6.0",
    "mutagen==1.47.0",
    "Flask-Limiter==4.1.1",
    "Flask-Talisman==1.1.0",
    "pychromecast==14.0.9",
    "python-roku==3.1.5",
    "psutil==7.2.0",
    "py-cpuinfo==9.0.0",
    "google-auth==2.41.1",
    "google-auth-oauthlib==1.2.3",
    "google-auth-httplib2==0.3.0",
    "google-api-python-client==2.187.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "black==25.12.0",
    "ruff==0.14.10",
    "bandit==1.9.2"
]
e2e = [
    "pytest-playwright",
    "playwright",
]

[project.urls]
Homepage = "https://github.com/kitchen-hub/kitchen-hub"

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[tool.bandit]
exclude_dirs = ["tests", "hub/tests"]
skips = ["B101"]  # assert is correct in pytest test files

[tool.ruff]
# Set the line length limit
line-length = 120

# Minimum supported Python version
target-version = "py311"

[tool.ruff.lint]
# Enable basic linting rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]

# Avoid enforcing line-length violations (E501) and other problematic rules
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
# Ignore import violations in __init__.py files
"__init__.py" = ["F401", "E402"]

# Ignore unused import in test files
"**/test_*.py" = ["F401"]

[tool.black]
# Set the line length to match ruff's configuration
line-length = 120
# Set the target version for Python compatibility
target-version = ['py311']
# Skip normalization of string quotes to avoid conflicts with ruff
skip-string-normalization = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = [
    "tests",
    "hub/tests",
]
filterwarnings = [
    "ignore:.*:DeprecationWarning:httplib2\\..*",
]
