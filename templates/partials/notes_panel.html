<div class="panel" role="region" aria-labelledby="notes-panel-title">
    <div class="panel-header" role="heading" aria-level="2" id="notes-panel-title">
        <h2 class="panel-title">Notes</h2>
        <span class="item-count">({{ notes|length if notes else 0 }})</span>
    </div>
    
    <form id="add-note-form" 
          hx-post="/api/notes" 
          hx-target="#notes-list" 
          hx-swap="beforeend"
          hx-on:after-request="this.reset()"
          role="form"
          aria-label="Add new note">
        <div class="form-group">
            <label for="add-note-text" class="sr-only">Note Content</label>
            <textarea id="add-note-text" name="text" class="form-control" placeholder="Add a note..." required aria-label="Enter your note text"></textarea>
        </div>
        <button type="submit" class="btn btn-block" aria-label="Add note to list">Add Note</button>
    </form>
    
    <div id="notes-container" role="region" aria-label="Notes list">
        <ul id="notes-list" class="list-group" role="list" aria-label="List of notes">
            {% if notes %}
                {% for note in notes %}
                    <li class="list-group-item" id="note-{{ note.id }}" role="listitem" aria-label="Note: {{ note.text }}">
                        <div class="d-flex" style="justify-content: space-between; align-items: flex-start;">
                            <div class="note-content" style="flex: 1; text-align: left;">{{ note.text }}</div>
                            <div class="note-actions" role="group" aria-label="Note actions">
                                <button class="btn btn-sm"
                                        hx-get="/api/notes/{{ note.id }}/edit"
                                        hx-target="#note-{{ note.id }}"
                                        hx-swap="outerHTML"
                                        aria-label="Edit note: {{ note.text[:50] if note.text|length > 50 else note.text }}">
                                    <i class="icon icon-pencil" aria-hidden="true"></i>
                                    <span class="sr-only">Edit</span>
                                </button>
                                <button class="btn btn-sm btn-danger"
                                        hx-delete="/api/notes/{{ note.id }}"
                                        hx-target="#note-{{ note.id }}"
                                        hx-swap="delete"
                                        aria-label="Delete note: {{ note.text[:50] if note.text|length > 50 else note.text }}">
                                    <i class="icon icon-trash" aria-hidden="true"></i>
                                    <span class="sr-only">Delete</span>
                                </button>
                            </div>
                        </div>
                    </li>
                {% endfor %}
            {% else %}
                <li class="list-group-item" role="listitem" aria-label="No notes available">No notes yet</li>
            {% endif %}
        </ul>
    </div>
</div>
