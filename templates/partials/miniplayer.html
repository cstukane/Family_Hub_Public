<div id="miniplayer" class="miniplayer">
    <div class="miniplayer-content">
        <div class="miniplayer-main-row">
            <!-- Album Art -->
            <div class="miniplayer-album-art">
                <img id="miniplayer-album-art" src="" alt="Album art" onerror="this.style.display='none';" onload="this.style.display='block';">
                <div id="miniplayer-default-art" class="default-art" style="display: none;"></div>
            </div>
            
            <!-- Track Info -->
            <div class="miniplayer-track-info">
                <div id="miniplayer-track-title" class="miniplayer-track-title">No track playing</div>
                <div id="miniplayer-track-artist" class="miniplayer-track-artist">-</div>
            </div>
        </div>

        <div class="miniplayer-meta-row">
            <div class="miniplayer-meta-left">
                <span class="miniplayer-device-label">Device</span>
                <span id="miniplayer-device-name" class="miniplayer-device-name">No device</span>
            </div>
            <button id="miniplayer-expand-btn" class="miniplayer-icon-btn miniplayer-expand-btn" aria-label="Expand player">
                +
            </button>
        </div>

        <!-- Progress row -->
        <div class="miniplayer-progress-row">
            <span id="miniplayer-current-time" class="miniplayer-time" aria-live="off">0:00</span>
            <input
                type="range"
                id="miniplayer-seek"
                class="miniplayer-seek"
                min="0"
                max="100"
                value="0"
                step="1"
                aria-label="Seek through track"
            >
            <span id="miniplayer-duration" class="miniplayer-time" aria-live="off">0:00</span>
        </div>

        <!-- Bottom rail -->
        <div class="miniplayer-bottom-row">
            <div class="miniplayer-left-rail">
                <div id="miniplayer-service-tray" class="miniplayer-service-tray" aria-label="Current media source">
                    <button class="service-icon is-active" data-service="spotify" title="Spotify">
                        SP
                    </button>
                </div>
                <button id="miniplayer-cast-btn" class="miniplayer-icon-btn" title="Cast to device" aria-label="Cast to device">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 18v3h3c0-1.66-1.34-3-3-3zM3 13v2c3.87 0 7 3.13 7 7h2c0-4.97-4.03-9-9-9zM3 8v2c6.08 0 11 4.93 11 11h2c0-7.18-5.82-13-13-13zM21 5H7c-1.1 0-2 .9-2 2v3h2V7h14v12h-6v2h6c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/>
                    </svg>
                </button>
            </div>

            <div class="miniplayer-center-rail">
                <div class="miniplayer-controls">
                    <button id="miniplayer-prev-btn" class="miniplayer-btn" title="Restart or Previous Track" aria-label="Restart or Previous Track">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                    </button>
                    <button id="miniplayer-play-btn" class="miniplayer-btn" title="Play" aria-label="Play">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button id="miniplayer-pause-btn" class="miniplayer-btn" style="display: none;" title="Pause" aria-label="Pause">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button id="miniplayer-next-btn" class="miniplayer-btn" title="Next Track" aria-label="Next Track">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 18 8.5-6L6 6v12zm2.5-6L15 6v12z"/></svg>
                    </button>
                </div>
            </div>

            <div class="miniplayer-right-rail">
                <div class="miniplayer-source-pills" role="tablist" aria-label="Miniplayer source">
                    <button class="miniplayer-source-pill is-active" type="button" data-source="spotify" role="tab" aria-selected="true">
                        Spotify
                    </button>
                    <button class="miniplayer-source-pill" type="button" data-source="podcasts" role="tab" aria-selected="false">
                        Podcasts
                    </button>
                    <button class="miniplayer-source-pill" type="button" data-source="fm" role="tab" aria-selected="false">
                        FM Radio
                    </button>
                </div>

                <div class="miniplayer-device-picker">
                    <label for="miniplayer-device-select">Device</label>
                    <select id="miniplayer-device-select" class="miniplayer-device-select" aria-label="Spotify playback device">
                        <option value="">Loading devices</option>
                    </select>
                </div>

                <div id="spotify-playlists-section" class="miniplayer-spotify-playlists" data-source-panel="spotify">
                    <div class="spotify-playlist-row">
                        <label for="spotify-playlist-list">Recently Played</label>
                        <div id="spotify-playlist-list" class="spotify-playlist-list" role="list" aria-label="Recently played Spotify playlists"></div>
                        <p id="spotify-playlist-empty" class="spotify-playlist-empty">Play a Spotify playlist to pin it here.</p>
                    </div>
                    <button id="spotify-shuffle-btn" class="miniplayer-btn miniplayer-auth-btn" aria-label="Shuffle play playlist">
                        Shuffle Play
                    </button>
                </div>

                <div class="miniplayer-source-placeholder" data-source-panel="podcasts" hidden>
                    Podcasts will land here soon.
                </div>

                <div class="miniplayer-source-placeholder" data-source-panel="fm" hidden>
                    FM radio presets will land here soon.
                </div>
            </div>
        </div>

        <!-- Spotify status & actions -->
        <div id="miniplayer-spotify-auth" class="miniplayer-spotify-auth" role="status" aria-live="polite" aria-atomic="true">
            <span id="spotify-auth-message" class="miniplayer-spotify-message">
                Connect Spotify to sync your library.
            </span>
            <div class="miniplayer-spotify-actions">
                <button id="spotify-connect-btn" class="miniplayer-btn miniplayer-auth-btn" aria-label="Connect Spotify">
                    Connect Spotify
                </button>
            </div>
        </div>
    </div>
</div>
