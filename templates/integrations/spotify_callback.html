<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Connection</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f7f7;
            color: #1f1f1f;
        }
        .status-card {
            max-width: 460px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        .status-card h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        .status-card p {
            margin: 1rem 0;
            font-size: 1rem;
        }
        .status-card.success h1 {
            color: #138000;
        }
        .status-card.error h1 {
            color: #c52f2f;
        }
        .close-hint {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="status-card {{ 'success' if status.success else 'error' }}">
        <h1>{{ 'Connected' if status.success else 'Connection Issue' }}</h1>
        <p>{{ status.message }}</p>
        <p class="close-hint">This window will close automatically.</p>
    </div>
    <script>
        setTimeout(function () {
            window.close();
        }, 3000);
    </script>
</body>
</html>
